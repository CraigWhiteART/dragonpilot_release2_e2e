name: C2 Subaru UI Publish

on:
  workflow_dispatch:
  push:
    branches:
      - c2-subaru-panda-research
    paths:
      - "tools/research/patch_c2_exact_ui.py"
      - ".github/workflows/c2-subaru-ui-publish.yml"

permissions:
  contents: write

concurrency:
  group: c2-subaru-ui-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch exact C2 UI binaries
        run: |
          python3 tools/research/patch_c2_exact_ui.py             selfdrive/ui/_ui             selfdrive/ui/_ui_nonav

      - name: Validate patched UI artifacts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          expected = {
            "selfdrive/ui/_ui": "8b92ddbf63830a21f6a71ec52aad5f5949287e438676738a90053a54896c10cc",
            "selfdrive/ui/_ui_nonav": "3dd2e552b5609c1b860bc93e4ba4e04c3d08af81043ebbc881d3924365caa14b",
          }
          for path, digest in expected.items():
            data = Path(path).read_bytes()
            assert hashlib.sha256(data).hexdigest() == digest
            assert b"dp_subaru_steer_enable" in data
            assert b"dp_subaru_steer_stage" in data
            assert b"Enable Subaru Steering Stages" in data
            assert b"Steering Authority Stage" in data
          print("UI artifacts validated")
          PY

      - name: Publish UI binaries
        run: |
          if git diff --quiet -- selfdrive/ui/_ui selfdrive/ui/_ui_nonav; then
            echo "UI binaries already published"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add selfdrive/ui/_ui selfdrive/ui/_ui_nonav
          git commit -m "Publish exact C2 Subaru steering-stage UI"
          git pull --rebase origin c2-subaru-panda-research
          git push origin HEAD:c2-subaru-panda-research
